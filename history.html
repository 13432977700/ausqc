<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>历史版本 · 澳思QC</title>
    <style type="text/css">
        :root {
            --bg-deep: #e88900;
            --bg-mid: #ffa200;
            --bg-light: #ffb833;
            --accent: #ff8000;
            --accent-hover: #ff9c2b;
            --accent-active: #df6600;
            --surface: rgba(255, 255, 255, 0.14);
            --surface-strong: rgba(255, 255, 255, 0.22);
            --text: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.88);
            --shadow: 0 10px 28px rgba(180, 90, 0, 0.28);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            color: var(--text);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
            background:
                radial-gradient(120% 80% at 50% -10%, var(--bg-light) 0%, transparent 55%),
                linear-gradient(165deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
            background-attachment: fixed;
        }

        .glow-top,
        .glow-bottom {
            position: fixed;
            left: 50%;
            width: 140%;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            background: rgba(255, 144, 0, 0.55);
            filter: blur(2px);
        }

        .glow-top {
            top: -18vh;
            height: 28vh;
            transform: translateX(-50%);
            animation: drift 8s ease-in-out infinite alternate;
        }

        .glow-bottom {
            bottom: -16vh;
            height: 24vh;
            transform: translateX(-50%);
            animation: drift 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes drift {
            from { transform: translateX(-52%) scale(1); }
            to { transform: translateX(-48%) scale(1.04); }
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 20px 36px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0 18px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            text-decoration: none;
            backdrop-filter: blur(6px);
            transition: background 0.25s, transform 0.2s;
            animation: fadeUp 0.5s ease both;
        }

        .back-link:hover {
            background: var(--surface-strong);
        }

        .back-link:active {
            transform: scale(0.97);
        }

        .brand {
            animation: fadeUp 0.55s ease 0.05s both;
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 4px 0 14px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            object-fit: cover;
        }

        .title {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.2;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--text-soft);
            font-size: 16px;
            letter-spacing: 0.12em;
        }

        .divider {
            width: 48px;
            height: 3px;
            margin: 18px auto 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.55);
            animation: fadeUp 0.55s ease 0.1s both;
        }

        .status {
            margin: 8px auto 0;
            max-width: 360px;
            padding: 18px 16px;
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-soft);
            font-size: 15px;
            backdrop-filter: blur(6px);
            animation: fadeUp 0.5s ease 0.15s both;
        }

        .status.loading::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            vertical-align: -1px;
            animation: spin 0.8s linear infinite;
        }

        .status.error {
            background: rgba(180, 60, 0, 0.35);
            color: #fff5e8;
        }

        .list {
            list-style: none;
            margin: 0 auto;
            padding: 0;
            max-width: 420px;
            text-align: left;
        }

        .list li {
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.45s ease forwards;
        }

        .list li:nth-child(1) { animation-delay: 0.08s; }
        .list li:nth-child(2) { animation-delay: 0.14s; }
        .list li:nth-child(3) { animation-delay: 0.2s; }
        .list li:nth-child(4) { animation-delay: 0.26s; }
        .list li:nth-child(5) { animation-delay: 0.32s; }
        .list li:nth-child(n + 6) { animation-delay: 0.38s; }

        .list a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--accent) 0%, #ff6a00 100%);
            box-shadow: var(--shadow);
            color: var(--text);
            text-decoration: none;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
        }

        .list a:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, #ff7a14 100%);
            box-shadow: 0 12px 32px rgba(180, 90, 0, 0.34);
        }

        .list a:active {
            background: linear-gradient(135deg, var(--accent-active) 0%, #c95500 100%);
            transform: scale(0.985);
        }

        .list a .meta {
            min-width: 0;
        }

        .list a .name {
            display: block;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: 0.02em;
            word-break: break-all;
        }

        .list a .hint {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            opacity: 0.85;
        }

        .list a .badge {
            flex-shrink: 0;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .footer-hint {
            margin-top: 22px;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.5;
            animation: fadeUp 0.55s ease 0.2s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 360px) {
            .title { font-size: 26px; }
            .list a { padding: 14px 14px; }
            .list a .name { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="glow-top" aria-hidden="true"></div>
    <div class="glow-bottom" aria-hidden="true"></div>

    <div class="page">
        <a class="back-link" href="index.html">← 返回最新版下载</a>

        <div class="brand">
            <img class="icon" alt="澳思QC" src="./apple-touch-icon.png">
            <h1 class="title">澳思QC</h1>
            <p class="subtitle">历史版本</p>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div id="status" class="status loading">加载中…</div>
        <ul id="list" class="list" style="display: none;"></ul>
        <div class="footer-hint">点击版本后返回桌面查看安装进度</div>
    </div>

    <script type="text/javascript">
        function stripExt(filename) {
            return filename.replace(/\.plist$/i, '');
        }

        function compareVersionName(a, b) {
            var pa = stripExt(a).split(/[^\d]+/).map(function (n) { return parseInt(n, 10) || 0; });
            var pb = stripExt(b).split(/[^\d]+/).map(function (n) { return parseInt(n, 10) || 0; });
            var len = Math.max(pa.length, pb.length);
            for (var i = 0; i < len; i++) {
                var diff = (pb[i] || 0) - (pa[i] || 0);
                if (diff !== 0) return diff;
            }
            return stripExt(b).localeCompare(stripExt(a), 'zh');
        }

        function buildInstallUrl(plistFile) {
            var plistUrl = new URL('history_plist/' + plistFile, window.location.href).href;
            return 'itms-services://?action=download-manifest&url=' + encodeURIComponent(plistUrl);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderList(files) {
            var status = document.getElementById('status');
            var list = document.getElementById('list');
            var plists = (files || []).filter(function (name) {
                return /\.plist$/i.test(name);
            }).sort(compareVersionName);

            if (!plists.length) {
                status.className = 'status empty';
                status.textContent = '暂无历史版本';
                status.style.display = 'block';
                list.style.display = 'none';
                return;
            }

            list.innerHTML = '';
            plists.forEach(function (file) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = buildInstallUrl(file);
                a.innerHTML =
                    '<span class="meta">' +
                        '<span class="name">' + escapeHtml(stripExt(file)) + '</span>' +
                        '<span class="hint">点击安装此版本</span>' +
                    '</span>' +
                    '<span class="badge">安装</span>';
                li.appendChild(a);
                list.appendChild(li);
            });

            status.style.display = 'none';
            list.style.display = 'block';
        }

        function showError(message) {
            var status = document.getElementById('status');
            status.className = 'status error';
            status.textContent = message;
            status.style.display = 'block';
            document.getElementById('list').style.display = 'none';
        }

        function fetchList(url) {
            return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now())
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                });
        }

        function loadHistory() {
            fetchList('history_list.json')
                .then(renderList)
                .catch(function (err) {
                    showError('加载失败：' + err.message);
                });
        }

        var wechatInfo = navigator.userAgent.match(/MicroMessenger\/([\d\.]+)/i);
        if (wechatInfo) {
            alert('请点击右上角，选择“在浏览器中打开”后再安装。');
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
